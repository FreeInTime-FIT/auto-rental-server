version: "3.9"

services:
  mysql:
    image: mysql:8.0.35
    container_name: mysql_8_0_35
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-testdb}"
      MYSQL_USER: "${MYSQL_USER:-appuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-apppass}"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2.1
    container_name: redis_7_2_1
    ports:
      - "26379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-@thisisadefaultredispass@}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-@thisisadefaultredispass@}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-@thisisadefaultredispass@} ping | grep -q PONG"]  
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  default:
    name: local_stack